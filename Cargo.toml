[package]
name = "ai-quotas"
version = "0.1.0"
edition = "2024"
description = "Monitor quotas and prepaid balances for AI services"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[lints.clippy]
pedantic = "warn"

[lints.rust]
unsafe_code = "forbid"
